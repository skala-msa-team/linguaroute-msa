spring:
  datasource:
    url: jdbc:h2:mem:course_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/unused
          issuer-uri: http://localhost

eureka:
  client:
    enabled: false

service:
  user-service:
    url: http://localhost

app:
  security:
    internal-api-key: test-key
