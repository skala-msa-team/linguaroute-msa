# This practice code is not a completed commercial version but has been developed for educational purposes; supplementation is required depending on the deployment objective for use as a commercial service.

services:

  # Infrastructure

  mariadb:
    image: mariadb:11.2
    container_name: lecturedb
    environment:
      MYSQL_ROOT_PASSWORD: SqlDba-1
      MYSQL_DATABASE: lecture_db
      MYSQL_USER: manager
      MYSQL_PASSWORD: SqlDba-1
    ports:
      - "3379:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lecture-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: lecture-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lecture-net


  # Service Discovery

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: lecture-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lecture-net


  # Auth Server

  auth-server:
    image: msa-lecture/auth-server:1.0
    container_name: lecture-auth
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - lecture-net


  # API Gateway

  api-gateway:
    image: msa-lecture/api-gateway:1.0
    container_name: lecture-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      # [설계 이유 - 내부 API의 외부 노출 차단]
      # 일반 서비스 라우트(/api/courses/** 등)는 internal 하위 경로까지 포함한다.
      # 가장 높은 우선순위의 차단 라우트를 먼저 매칭해 외부에는 내부 API 존재와
      # 인증 방식이 드러나지 않도록 404를 반환한다. 서비스 간 호출은 Gateway를
      # 거치지 않고 Docker 네트워크에서 직접 수행하며 별도의 내부 키도 검증한다.
      - SPRING_CLOUD_GATEWAY_ROUTES_0_ID=block-internal-api
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=no://op
      - SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0=Path=/api/courses/internal/**,/api/enrollments/internal/**,/api/payments/internal/**
      - SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0=SetStatus=404
      - SPRING_CLOUD_GATEWAY_ROUTES_0_ORDER=-100
      - SPRING_CLOUD_GATEWAY_ROUTES_1_ID=user-service
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=lb://user-service
      - SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0=Path=/api/users/**
      - SPRING_CLOUD_GATEWAY_ROUTES_2_ID=recommend-service
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=lb://recommend-service
      - SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0=Path=/api/courses/recommendations,/api/courses/recommendations/**
      - SPRING_CLOUD_GATEWAY_ROUTES_3_ID=course-service
      - SPRING_CLOUD_GATEWAY_ROUTES_3_URI=lb://course-service
      - SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0=Path=/api/courses/**
      - SPRING_CLOUD_GATEWAY_ROUTES_4_ID=enrollment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_4_URI=lb://enrollment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0=Path=/api/enrollments/**
      - SPRING_CLOUD_GATEWAY_ROUTES_5_ID=payment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_5_URI=lb://payment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0=Path=/api/payments/**
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net


  # Microservices

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: lecture-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: lecture-course
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net

  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: lecture-enrollment
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - lecture-net

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: lecture-payment
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - lecture-net

  recommend-service:
    build:
      context: ./recommend-service
      dockerfile: Dockerfile
    container_name: lecture-recommend
    ports:
      - "8085:8085"
    environment:
      - APP_PORT=8085
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=recommend-service
      - JWT_ISSUER_URI=http://localhost:8080
      - JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:8083
      - COURSE_SERVICE_URL=http://course-service:8082
      - USER_SERVICE_URL=http://user-service:8081
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-15}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-1}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-600}
      - DATABASE_URL=mysql+pymysql://manager:SqlDba-1@lecturedb:3306/lecture_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      enrollment-service:
        condition: service_started
      course-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - lecture-net


# Volumes & Networks

volumes:
  mariadb_data:
  kafka_data:

networks:
  lecture-net:
    driver: bridge
