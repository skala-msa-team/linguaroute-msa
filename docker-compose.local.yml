# The following practice code is intended for educational purposes only.
# For contact: audit@korea.ac.kr, Sungryel Lim Ph.D
#
# Student runtime version (ARM64)
# - Uses prebuilt Docker images only
# - Does not execute Dockerfile/Gradle builds
# - Load the distributed image archive before starting:
#     docker load -i msa-lecture-images-arm64.tar
# - Start with:
#     docker compose -f docker-compose.local.yml up -d --no-build --pull never

services:

  # Infrastructure

  mariadb:
    image: mariadb:11.2
    platform: linux/arm64/v8
    container_name: lecturedb
    environment:
      MYSQL_ROOT_PASSWORD: SqlDba-1
      MYSQL_DATABASE: lecture_db
      MYSQL_USER: manager
      MYSQL_PASSWORD: SqlDba-1
    ports:
      - "3379:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lecture-net

  db-migration:
    image: mariadb:11.2
    platform: linux/arm64/v8
    container_name: lecture-db-migration
    command:
      - sh
      - -c
      - mariadb -h mariadb -umanager -pSqlDba-1 lecture_db < /migrations/001_users_auth_compat.sql
    volumes:
      - ./init-db/migrations:/migrations:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"
    networks:
      - lecture-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    platform: linux/arm64
    container_name: lecture-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lecture-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lecture-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - lecture-net

  # Service Discovery

  eureka-server:
    image: msa-lecture-eureka-server:latest
    platform: linux/arm64
    container_name: lecture-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lecture-net

  # Auth Server

  auth-server:
    image: msa-lecture/auth-server:1.0
    platform: linux/arm64
    container_name: lecture-auth
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mariadb:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - lecture-net

  # API Gateway

  api-gateway:
    image: msa-lecture/api-gateway:1.0
    platform: linux/arm64
    container_name: lecture-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_0_ID=auth-server
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://auth-server:9000
      - SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0=Path=/oauth2/**,/login,/login/**,/logout,/userinfo,/error,/default-ui.css,/favicon.ico,/.well-known/openid-configuration,/.well-known/oauth-authorization-server
      - SPRING_CLOUD_GATEWAY_ROUTES_1_ID=block-internal-api
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=no://op
      - SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0=Path=/api/courses/internal/**,/api/enrollments/internal/**,/api/payments/internal/**
      - SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0=SetStatus=403
      - SPRING_CLOUD_GATEWAY_ROUTES_1_ORDER=-100
      - SPRING_CLOUD_GATEWAY_ROUTES_2_ID=user-service
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=lb://user-service
      - SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0=Path=/api/users,/api/users/**,/api/companies,/api/companies/me,/api/companies/me/invitations,/api/companies/me/invitations/**,/api/companies/me/employees,/api/companies/me/employees/**,/api/companies/me/seats,/api/terms,/api/terms/**,/api/auth,/api/auth/**,/api/employees,/api/employees/**,/api/admin/users,/api/admin/users/**,/api/admin/companies,/api/admin/companies/**
      - SPRING_CLOUD_GATEWAY_ROUTES_3_ID=course-service
      - SPRING_CLOUD_GATEWAY_ROUTES_3_URI=lb://course-service
      - SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0=Path=/api/courses,/api/courses/**,/api/admin/courses,/api/admin/courses/**
      - SPRING_CLOUD_GATEWAY_ROUTES_4_ID=enrollment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_4_URI=lb://enrollment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0=Path=/api/enrollments,/api/enrollments/**,/api/companies/me/enrollments,/api/companies/me/enrollments/**
      - SPRING_CLOUD_GATEWAY_ROUTES_5_ID=payment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_5_URI=lb://payment-service
      - SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0=Path=/api/payments,/api/payments/**,/api/plans,/api/plans/**,/api/subscriptions,/api/subscriptions/**
      - SPRING_CLOUD_GATEWAY_ROUTES_6_ID=recommend-service
      - SPRING_CLOUD_GATEWAY_ROUTES_6_URI=lb://recommend-service
      - SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0=Path=/api/recommend,/api/recommend/**
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net

  # Microservices

  user-service:
    image: msa-lecture-user-service:latest
    platform: linux/arm64
    container_name: lecture-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_FROM=${MAIL_FROM:-no-reply@linguaroute.local}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - AUTH_SERVER_TOKEN_URL=http://auth-server:9000/oauth2/token
      - AUTH_WEB_CLIENT_ID=${AUTH_WEB_CLIENT_ID:-web-client}
      - AUTH_WEB_CLIENT_SECRET=${AUTH_WEB_CLIENT_SECRET:-web-secret}
      - AUTH_WEB_REDIRECT_URI=${AUTH_WEB_REDIRECT_URI:-http://localhost:3000/callback}
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - lecture-net

  course-service:
    image: msa-lecture-course-service:latest
    platform: linux/arm64
    container_name: lecture-course
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
      - SERVICE_USER_SERVICE_URL=http://user-service:8081
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net

  enrollment-service:
    image: msa-lecture-enrollment-service:latest
    platform: linux/arm64
    container_name: lecture-enrollment
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
      - SERVICE_COURSE_SERVICE_URL=http://course-service:8082
      - SERVICE_USER_SERVICE_URL=http://user-service:8081
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - lecture-net

  payment-service:
    image: msa-lecture-payment-service:latest
    platform: linux/arm64
    container_name: lecture-payment
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
      - SERVICE_USER_SERVICE_URL=http://user-service:8081
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - lecture-net

  recommend-service:
    image: msa-lecture-recommend-service:latest
    platform: linux/arm64
    container_name: lecture-recommend
    ports:
      - "8085:8085"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=recommend-service
      - JWT_ISSUER_URI=http://localhost:8080
      - JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:8083
      - COURSE_SERVICE_URL=http://course-service:8082
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-local-internal-api-key}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      enrollment-service:
        condition: service_started
      course-service:
        condition: service_started
    networks:
      - lecture-net

volumes:
  mariadb_data:
  kafka_data:

networks:
  lecture-net:
    driver: bridge
