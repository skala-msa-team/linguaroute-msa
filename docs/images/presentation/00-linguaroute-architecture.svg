<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">LinguaRoute MSA 아키텍처</title>
  <desc id="desc">Vue Frontend, API Gateway, 인증 서버, Eureka, 5개 도메인 서비스, Kafka와 MariaDB 사이의 호출 및 이벤트 흐름</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d2c"/>
      <stop offset="1" stop-color="#2f704b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10271d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4d7d3a"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6d5cad"/>
    </marker>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .lane { fill: #f4f8f1; stroke: #d8e4d4; stroke-width: 2; rx: 22; }
      .label { font-size: 18px; font-weight: 800; fill: #598448; letter-spacing: 1.4px; }
      .node-title { font-size: 23px; font-weight: 800; fill: #172019; }
      .node-sub { font-size: 16px; fill: #607066; }
      .edge-label { font-size: 15px; font-weight: 700; fill: #526158; }
      .service-title { font-size: 20px; font-weight: 800; fill: #172019; }
      .service-sub { font-size: 14px; fill: #617168; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="#fbfcf8"/>
  <rect x="55" y="42" width="1490" height="112" rx="28" fill="url(#header)"/>
  <text x="95" y="92" font-size="34" font-weight="850" fill="#ffffff">LinguaRoute MSA 아키텍처</text>
  <text x="95" y="127" font-size="18" fill="#d9ebd6">B2B2E 기업 외국어교육 구독 · AI 추천 · 학습 관리</text>
  <text x="1505" y="101" text-anchor="end" font-size="17" font-weight="700" fill="#c6f26a">광주 3반 6조</text>

  <rect class="lane" x="55" y="185" width="250" height="300"/>
  <text class="label" x="85" y="220">USER CHANNEL</text>
  <g filter="url(#shadow)">
    <rect x="85" y="248" width="190" height="92" rx="18" fill="#e8f5d6" stroke="#b8d98c" stroke-width="2"/>
    <text class="node-title" x="180" y="283" text-anchor="middle">사용자 역할</text>
    <text class="node-sub" x="180" y="314" text-anchor="middle">직원 · 기업 관리자</text>
    <text class="node-sub" x="180" y="335" text-anchor="middle">플랫폼 관리자</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="85" y="370" width="190" height="82" rx="18" fill="#c7f16b" stroke="#8dbc38" stroke-width="2"/>
    <text class="node-title" x="180" y="404" text-anchor="middle">Vue Frontend</text>
    <text class="node-sub" x="180" y="431" text-anchor="middle">역할별 화면 · JWT 저장</text>
  </g>

  <rect class="lane" x="345" y="185" width="290" height="300"/>
  <text class="label" x="375" y="220">ENTRY &amp; AUTH</text>
  <g filter="url(#shadow)">
    <rect x="375" y="248" width="230" height="75" rx="18" fill="#24533b"/>
    <text x="490" y="281" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">API Gateway</text>
    <text x="490" y="305" text-anchor="middle" font-size="15" fill="#d9ebdf">/api · JWT 검증 · 라우팅</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="375" y="343" width="108" height="92" rx="16" fill="#fff1bf" stroke="#dcc56d" stroke-width="2"/>
    <text x="429" y="378" text-anchor="middle" font-size="20" font-weight="800">Eureka</text>
    <text x="429" y="405" text-anchor="middle" font-size="14" fill="#716336">등록 · 탐색</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="497" y="343" width="108" height="92" rx="16" fill="#e9e5fa" stroke="#bdb4e3" stroke-width="2"/>
    <text x="551" y="374" text-anchor="middle" font-size="18" font-weight="800">인증 서버</text>
    <text x="551" y="399" text-anchor="middle" font-size="13" fill="#665a8a">Email Login</text>
    <text x="551" y="419" text-anchor="middle" font-size="13" fill="#665a8a">JWT Access Token</text>
  </g>

  <rect class="lane" x="675" y="185" width="870" height="300"/>
  <text class="label" x="705" y="220">LINGUAROUTE DOMAIN SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="705" y="248" width="242" height="90" rx="18" fill="#ffffff" stroke="#b9d0bd" stroke-width="2"/>
    <text class="service-title" x="826" y="281" text-anchor="middle">user-service</text>
    <text class="service-sub" x="826" y="308" text-anchor="middle">기업 · 사용자 · 초대 · 좌석</text>
    <text class="service-sub" x="826" y="329" text-anchor="middle">구독 권한 캐시</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="968" y="248" width="242" height="90" rx="18" fill="#ffffff" stroke="#b9d0bd" stroke-width="2"/>
    <text class="service-title" x="1089" y="281" text-anchor="middle">course-service</text>
    <text class="service-sub" x="1089" y="308" text-anchor="middle">강의 · 차시 · 검색 · 필터</text>
    <text class="service-sub" x="1089" y="329" text-anchor="middle">ACTIVE 상태 관리</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1231" y="248" width="284" height="90" rx="18" fill="#ffffff" stroke="#b9d0bd" stroke-width="2"/>
    <text class="service-title" x="1373" y="281" text-anchor="middle">enrollment-service</text>
    <text class="service-sub" x="1373" y="308" text-anchor="middle">수강신청 · 차시 완료</text>
    <text class="service-sub" x="1373" y="329" text-anchor="middle">서버 진도율 계산</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="835" y="365" width="260" height="90" rx="18" fill="#ffffff" stroke="#b9d0bd" stroke-width="2"/>
    <text class="service-title" x="965" y="398" text-anchor="middle">payment-service</text>
    <text class="service-sub" x="965" y="425" text-anchor="middle">요금제 · 구독 · 모의 결제</text>
    <text class="service-sub" x="965" y="446" text-anchor="middle">멱등성 · 이벤트 발행</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1120" y="365" width="260" height="90" rx="18" fill="#ffffff" stroke="#b9d0bd" stroke-width="2"/>
    <text class="service-title" x="1250" y="398" text-anchor="middle">recommend-service</text>
    <text class="service-sub" x="1250" y="425" text-anchor="middle">AI 추천 · 추천 이유</text>
    <text class="service-sub" x="1250" y="446" text-anchor="middle">규칙 기반 대체 추천</text>
  </g>

  <path d="M180 340 V370" stroke="#4d7d3a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M275 411 H375" stroke="#4d7d3a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="edge-label" x="325" y="397" text-anchor="middle">REST /api</text>
  <path d="M605 285 H705" stroke="#4d7d3a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="edge-label" x="655" y="271" text-anchor="middle">서비스 라우팅</text>
  <path d="M490 323 V343" stroke="#4d7d3a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="525" width="1490" height="155" rx="24" fill="#eff5ec" stroke="#d2e0cd" stroke-width="2"/>
  <text class="label" x="85" y="562">SYNCHRONOUS SERVICE CALLS</text>
  <g>
    <rect x="85" y="585" width="430" height="68" rx="14" fill="#ffffff" stroke="#cedbca"/>
    <text x="300" y="613" text-anchor="middle" font-size="18" font-weight="800">enrollment-service → user-service</text>
    <text x="300" y="638" text-anchor="middle" font-size="15" fill="#607066">직원 역할 · 기업 소속 · 활성 구독 권한 확인</text>
  </g>
  <g>
    <rect x="585" y="585" width="430" height="68" rx="14" fill="#ffffff" stroke="#cedbca"/>
    <text x="800" y="613" text-anchor="middle" font-size="18" font-weight="800">enrollment-service → course-service</text>
    <text x="800" y="638" text-anchor="middle" font-size="15" fill="#607066">신청 대상 강의의 ACTIVE 상태 확인</text>
  </g>
  <g>
    <rect x="1085" y="585" width="430" height="68" rx="14" fill="#ffffff" stroke="#cedbca"/>
    <text x="1300" y="613" text-anchor="middle" font-size="18" font-weight="800">recommend-service → course-service</text>
    <text x="1300" y="638" text-anchor="middle" font-size="15" fill="#607066">실제 ACTIVE 강의 · 요청 언어 일치 검증</text>
  </g>

  <rect x="55" y="715" width="1490" height="98" rx="24" fill="#3d355f"/>
  <text x="88" y="750" font-size="17" font-weight="800" fill="#d9d0fb">ASYNC SUBSCRIPTION EVENTS</text>
  <text x="100" y="786" font-size="21" font-weight="800" fill="#ffffff">payment-service</text>
  <path d="M300 780 H580" stroke="#bfaeff" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <text x="440" y="766" text-anchor="middle" font-size="14" fill="#e9e3ff">Completed · Failed · Canceled · Expired · Renewed</text>
  <text x="650" y="787" font-size="25" font-weight="850" fill="#c6f26a">Kafka</text>
  <path d="M740 780 H1040" stroke="#bfaeff" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <text x="890" y="766" text-anchor="middle" font-size="14" fill="#e9e3ff">eventId 중복 방지 · 권한 상태 전달</text>
  <text x="1110" y="786" font-size="21" font-weight="800" fill="#ffffff">user-service</text>
  <text x="1318" y="786" font-size="15" fill="#e9e3ff">권한 · 좌석 · 기간 반영</text>

  <rect x="55" y="843" width="1490" height="66" rx="20" fill="#eeeafa" stroke="#c7bfe9" stroke-width="2"/>
  <text x="87" y="882" font-size="19" font-weight="800" fill="#584d82">MariaDB lecture_db</text>
  <text x="305" y="882" font-size="16" fill="#625a78">하나의 DB · 서비스별 소유 테이블만 접근 · 서비스 간 FK와 직접 조인 금지 · 논리 참조 ID 사용</text>
</svg>
